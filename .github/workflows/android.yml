name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (decision core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleFullDebug :app:assemblePlayDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: heron-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

  # Installs the app on an Android 15 emulator, downloads the published model
  # and runs the on-device tests (download/resume/checksum, ONNX on Android,
  # self-test, live notification-listener pipeline).
  device-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Wait for the published model (built by model.yml)
        run: |
          URL=https://github.com/${{ github.repository }}/releases/download/model-v1/manifest.json
          for i in $(seq 1 60); do
            # Wait for a manifest in the format this app version expects.
            if curl -sfL "$URL" -o manifest.json && grep -q decision_config.json manifest.json; then cat manifest.json; exit 0; fi
            echo "model-v1 not published yet, waiting ($i)…"; sleep 20
          done
          echo "Model release never appeared"; exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb emu sms send 92002020 "QNB: Your card ending 4421 was used for QAR 245.50 at CARREFOUR CITY CENTER" || true
            adb emu sms send 92002020 "QNB: QAR 38.00 spent at STARBUCKS VILLAGGIO with card ending 4421" || true
            adb emu sms send 92002020 "QNB: QAR 12,500.00 has been credited to your account as SALARY" || true
            adb emu sms send 55501234 "See you at 8!" || true
            ./gradlew :app:connectedFullDebugAndroidTest --stacktrace > device-test.log 2>&1; echo $? > device-test.exit
            adb pull /data/local/tmp/heron-shots shots || echo "no screenshots"
            adb logcat -d -s HeronTest:I HeronModel:* HeronListener:* AndroidRuntime:E > device-logcat.txt || true

      - name: Test results
        if: always()
        run: |
          tail -n 60 device-test.log || true
          grep -E "HeronTest|AndroidRuntime" device-logcat.txt | tail -n 120 || true
          exit $(cat device-test.exit 2>/dev/null || echo 1)

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git -c user.name="heron-ci" -c user.email="heron-ci@users.noreply.github.com" add -A
          git -c user.name="heron-ci" -c user.email="heron-ci@users.noreply.github.com" commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
